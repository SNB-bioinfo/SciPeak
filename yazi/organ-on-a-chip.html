const BODY={
tr:[
"Bir hücreyi petri kabında büyütmek, onu evinden alıp bomboş bir odaya koymaya benzer. Gerçek dokuda o hücrenin üzerinden kan akar, komşu hücre tipleriyle sürekli sinyal alışverişi yapar, akciğerde nefesle birlikte gerilip gevşer, bağırsakta ise kasılan bir duvara tutunur. Düz plastik bir yüzeyde bunların hiçbiri yoktur. Bu yüzden laboratuvarda mükemmel görünen pek çok ilaç, insana geldiğinde beklenmedik biçimde davranır.",
"İşte <em>organ-on-a-chip</em>, yani çip üstü organ teknolojisi, tam olarak bu boşluğu kapatmak için geliştirildi. Literatürde <em>mikrofizyolojik sistem</em> (MPS) ya da “doku çipi” adıyla da geçen bu cihazlar, genellikle bir hafıza kartı büyüklüğünde, içinde saç telinden ince kanallar barındıran şeffaf bloklardır. Amaç bir organın minyatürünü yapmak değildir. Amaç, o organın işlevini belirleyen en küçük yapıyı, örneğin akciğerde hava ile kan arasındaki arayüzü, canlı insan hücreleriyle ve doğru fiziksel kuvvetler altında yeniden kurmaktır.",
"Klasik tasarım şöyle işler: yumuşak litografi yöntemiyle, polidimetilsiloksan (PDMS) adı verilen şeffaf ve esnek bir silikon polimere mikron ölçekli kanallar basılır. Üst üste konumlanan iki kanal, gözenekli ve esneyebilen ince bir zarla ayrılır. Zarın bir yüzü hücre dışı matriks proteinleriyle kaplanıp epitel hücrelerle (alveol, bağırsak, böbrek tübülü gibi), diğer yüzü ise damar endotel hücreleriyle kaplanır. Kanallardan pompayla besiyeri geçirilir; böylece hücreler damar içindekine benzer bir kayma gerilimi (shear stress) hisseder. Kanalların yanına açılan boş odacıklara ritmik vakum uygulandığında zar gerilip gevşer ve nefes alma ya da bağırsak peristaltizmi taklit edilir. Sonuçta elimizde akan, gerilen ve iki farklı doku tipinin gerçekten temas ettiği bir sistem olur.",
"Bu yaklaşımın ilk büyük örneği 2010'da <em>Science</em>'ta yayımlandı. Harvard Wyss Enstitüsü'nden Dongeun Huh ve Donald Ingber'in ekibi, insan akciğerinin alveol-kapiller arayüzünü çip üzerinde yeniden kurdu ve yan kanallardaki vakumla nefes benzeri siklik gerilme uyguladı. Sonuç dikkat çekiciydi: silika nanopartiküllere verilen toksik ve iltihabi yanıt, hücreler “nefes alırken” belirgin biçimde arttı. Mekanik gerilme ayrıca partiküllerin epitel ve endotel tarafından alınmasını ve alttaki damar kanalına taşınmasını hızlandırdı. Aynı etki canlı fare akciğerinde de gözlendi. Yani statik kültürde tamamen gözden kaçan bir mekanizma, sadece hareket eklendiği için görünür hale gelmişti.",
"İki yıl sonra aynı grup bağırsak çipini tanıttı. Caco-2 epitel hücreleri, akış ve peristaltizm benzeri gerilme altında kendiliğinden kıvrılarak villus benzeri yapılar oluşturdu ve küçük moleküllere karşı klasik Transwell kültürlerinden daha gerçekçi bir bariyer kurdu. Üstelik bu ortamda <em>Lactobacillus rhamnosus</em> GG epitelin lümen yüzeyinde bir haftadan uzun süre canlı tutulabildi; bakteri hücreleri öldürmek yerine, insanda gözlendiği gibi bariyer işlevini iyileştirdi. Statik kültürde bakteri genelde birkaç gün içinde kültürü bozduğu için bu, mikrobiyota çalışmaları açısından önemli bir eşikti.",
"Teknoloji hızla üreme biyolojisine de taşındı. Northwestern Üniversitesi'nden Teresa Woodruff ekibi 2017'de EVATAR adını verdikleri sistemde over, tuba uterina, uterus, serviks ve karaciğer dokularını ayrı modüllere yerleştirip aralarında sürekli dolaşan bir akışla bağladı. Fare ovaryan foliküllerinden salınan hormonlar, insanın 28 günlük menstrüel döngüsüne ait hormon profilini kültür ortamında üretti ve diğer dokuların davranışını yönetti. Yani organlar arası endokrin geri bildirim döngüsü, ilk kez bu ölçekte laboratuvarda kurulmuş oldu.",
"Alan bugün “çok organlı çip”lere doğru ilerliyor. 2022'de Columbia Üniversitesi'nden Gordana Vunjak-Novakovic ekibi; olgunlaştırılmış insan kalp, karaciğer, kemik ve deri dokularını, her biri kendi optimum ortamında kalacak şekilde seçici geçirgen bir endotel bariyeriyle ortak bir damar akışına bağladı. Dokular dört hafta boyunca moleküler ve işlevsel fenotiplerini korudu. Sistem, kanser ilacı doksorubisinin insandaki farmakokinetik ve farmakodinamik profilini yeniden üretti ve kardiyotoksisitenin erken miRNA biyobelirteçlerinin belirlenmesini sağladı.",
"Peki bu sistemler gerçekten daha mı iyi tahmin ediyor? Bu soruya en net yanıtlardan biri 2022'de <em>Communications Medicine</em>'de yayımlandı. Emulate ekibi, hepatotoksik olduğu ve olmadığı bilinen 27 ilacı körlemesine, toplam 870 karaciğer çipi üzerinde test etti. Karaciğer çipi, ilaca bağlı karaciğer hasarını %87 duyarlılık ve %100 özgüllükle saptadı; yani hiçbir güvenli ilacı yanlışlıkla toksik göstermedi. Test edilen hepatotoksik ilaçların bir kısmı hayvan çalışmalarından sorunsuz geçmiş ilaçlardı. Çalışmanın ekonomik analizi, böyle bir tarama basamağının yaygınlaşması durumunda ilaç endüstrisine yılda 3 milyar doların üzerinde Ar-Ge verimlilik kazancı sağlayabileceğini öne sürüyor.",
"Bu tür veriler düzenleyici kurumların da ilgisini çekti. FDA, Nisan 2025'te klinik öncesi güvenlilik çalışmalarında hayvan kullanımını azaltmaya yönelik bir yol haritası yayımladı ve monoklonal antikorlardan başlayarak kabul edilebilir “yeni yaklaşım metodolojileri” (NAM) arasında organ-on-a-chip sistemlerini açıkça saydı. Kurumun gerekçesi çarpıcı: hayvan çalışmalarından başarıyla geçen ilaçların %90'ından fazlası, güvenlilik veya etkililik sorunları nedeniyle insanda onay alamıyor.",
"Yine de bu teknoloji bir sihirli değnek değil. En sık kullanılan malzeme olan PDMS, hidrofobik küçük molekülleri emme eğilimindedir; bu da bir ilacın kanaldaki gerçek konsantrasyonunu belirsizleştirip doz-yanıt ölçümlerini bozabilir. Bunun yanında standardizasyon eksikliği, düşük iş hacmi, yüksek maliyet ve deneyimli personel gereksinimi yaygınlaşmanın önündeki başlıca engeller olarak sayılıyor. Çoğu çipte bağışıklık sistemi ve tam bir vasküler ağ hala eksik; iPSC kaynaklı hücrelerdeki donörler arası farklılıklar da tekrarlanabilirliği zorlaştırıyor. ABD Sayıştayı'nın (GAO) 2025 raporunda vurgulandığı gibi, bu sistemlerin hangi durumlarda diğer hücre temelli yöntemlerden daha öngörücü olduğu büyük ölçekli karşılaştırmalar olmadan her zaman net değil.",
"Alanın bir sonraki adımı, çipleri hastanın kendi hücreleriyle kurmak. Bir bireyin iPSC'lerinden türetilen doku çipleri, o kişiye özgü ilaç yanıtını laboratuvarda test etmeye izin veren bir tür biyolojik avatar işlevi görebilir. Bu noktada organ çipleri, dijital ikiz yaklaşımının doğal tamamlayıcısı haline geliyor: çip ölçümü üretiyor, hesaplamalı model bu ölçümü tüm vücut ölçeğine taşıyor. Nadir hastalıklar, toksikoloji ve kişiselleştirilmiş onkoloji şu an için en umut verici kullanım alanları.",
"Kısacası organ-on-a-chip, biyolojiyi düz bir plastik yüzeyden çıkarıp akışın, basıncın ve hareketin olduğu bir ortama geri taşıyor. Henüz hayvan deneylerinin yerini tamamen almış değil. Ama hangi soruların artık petri kabında sorulmaması gerektiğini bize giderek daha net gösteriyor."

en:[
"Growing a cell in a Petri dish is a bit like taking it out of its home and placing it in an empty room. In real tissue, blood flows over that cell, it constantly exchanges signals with neighbouring cell types, it stretches and relaxes with every breath in the lung, and it clings to a contracting wall in the gut. None of this exists on a flat plastic surface. This is one reason why many drugs that look perfect in the lab behave unexpectedly once they reach humans.",
"<em>Organ-on-a-chip</em> technology was developed precisely to close this gap. Also known in the literature as <em>microphysiological systems</em> (MPS) or “tissue chips”, these devices are typically transparent blocks about the size of a memory card, containing channels thinner than a human hair. The goal is not to build a miniature organ. The goal is to rebuild the smallest structure that defines the organ's function, for example the interface between air and blood in the lung, using living human cells under the right physical forces.",
"The classic design works like this: using soft lithography, micron-scale channels are patterned into polydimethylsiloxane (PDMS), a transparent and flexible silicone polymer. Two channels stacked on top of one another are separated by a thin, porous, stretchable membrane. One face of the membrane is coated with extracellular matrix proteins and lined with epithelial cells (alveolar, intestinal, kidney tubule and so on), while the other face is lined with vascular endothelial cells. Culture medium is pumped through the channels, so the cells experience a shear stress similar to that inside a blood vessel. When rhythmic vacuum is applied to hollow side chambers, the membrane stretches and relaxes, mimicking breathing or intestinal peristalsis. The result is a system that flows, stretches, and in which two different tissue types genuinely touch.",
"The first major example of this approach was published in <em>Science</em> in 2010. The team of Dongeun Huh and Donald Ingber at Harvard's Wyss Institute reconstituted the alveolar-capillary interface of the human lung on a chip and applied breathing-like cyclic strain through vacuum in the side channels. The result was striking: the toxic and inflammatory response to silica nanoparticles increased markedly while the cells were “breathing”. Mechanical strain also accelerated nanoparticle uptake by the epithelium and endothelium and their transport into the underlying vascular channel. The same effect was observed in whole mouse lung. In other words, a mechanism completely invisible in static culture became visible simply by adding motion.",
"Two years later the same group introduced the gut chip. Under flow and peristalsis-like strain, Caco-2 epithelial cells spontaneously folded into villus-like structures and formed a barrier to small molecules that was more realistic than conventional Transwell cultures. Moreover, <em>Lactobacillus rhamnosus</em> GG could be kept alive on the luminal surface of the epithelium for more than a week, and rather than killing the cells the bacterium improved barrier function, as observed in humans. Since bacteria usually destroy static cultures within a few days, this was an important threshold for microbiome research.",
"The technology quickly moved into reproductive biology as well. In 2017, Teresa Woodruff's team at Northwestern University built a system they called EVATAR, placing ovary, fallopian tube, uterus, cervix and liver tissues in separate modules connected by continuously circulating flow. Hormones released by murine ovarian follicles reproduced the hormone profile of the human 28-day menstrual cycle in culture and drove the behaviour of the other tissues. For the first time at this scale, an inter-organ endocrine feedback loop had been assembled in the laboratory.",
"Today the field is moving towards “multi-organ chips”. In 2022, Gordana Vunjak-Novakovic's team at Columbia University linked matured human heart, liver, bone and skin tissues to a shared vascular flow through a selectively permeable endothelial barrier, while each tissue stayed in its own optimal environment. The tissues preserved their molecular and functional phenotypes over four weeks. The system reproduced the human pharmacokinetic and pharmacodynamic profile of the cancer drug doxorubicin and enabled the identification of early miRNA biomarkers of cardiotoxicity.",
"But do these systems actually predict better? One of the clearest answers came in <em>Communications Medicine</em> in 2022. The Emulate team tested 27 drugs with known hepatotoxic and non-hepatotoxic profiles in a blinded fashion across a total of 870 liver chips. The Liver-Chip detected drug-induced liver injury with 87% sensitivity and 100% specificity, meaning it never falsely flagged a safe drug as toxic. Some of the hepatotoxic drugs tested had previously passed animal studies without issue. The study's economic analysis suggests that broad adoption of such a screening step could generate over $3 billion per year in R&D productivity for the pharmaceutical industry.",
"Data of this kind also caught the attention of regulators. In April 2025 the FDA published a roadmap for reducing animal use in preclinical safety studies, explicitly listing organ-on-a-chip systems among the acceptable “new approach methodologies” (NAMs), starting with monoclonal antibodies. The agency's rationale is striking: more than 90% of drugs that successfully pass animal studies fail to gain approval in humans, mostly because of safety or efficacy problems.",
"Even so, the technology is no magic wand. PDMS, the most widely used material, tends to absorb hydrophobic small molecules, which can obscure a drug's true concentration in the channel and distort dose-response measurements. Lack of standardisation, low throughput, high cost and the need for skilled personnel are cited as the main barriers to wider adoption. Most chips still lack an immune system and a full vascular network, and donor-to-donor variability in iPSC-derived cells complicates reproducibility. As the 2025 report by the U.S. Government Accountability Office (GAO) emphasises, without large-scale comparisons it is not always clear in which situations these systems are more predictive than other cell-based methods.",
"The field's next step is to build chips from a patient's own cells. Tissue chips derived from an individual's iPSCs could act as a kind of biological avatar, allowing that person's drug response to be tested in the laboratory. At this point organ chips become the natural complement of the digital twin approach: the chip produces the measurement, and the computational model scales that measurement up to the whole body. Rare diseases, toxicology and personalised oncology currently look like the most promising applications.",
"In short, organ-on-a-chip takes biology off a flat plastic surface and returns it to an environment with flow, pressure and movement. It has not yet fully replaced animal experiments. But it is showing us ever more clearly which questions should no longer be asked in a Petri dish."
]
};

let lang='tr';
try{const sv=localStorage.getItem('scipeak_lang');if(sv)lang=sv}catch{}

function render(){
  document.documentElement.lang=lang;
  const paras=BODY[lang].map(p=>'<p>'+p+'</p>');

  // Append references to the end of the content
  document.getElementById('content').innerHTML=paras.join('') + REFS[lang];

  document.querySelectorAll('[data-tr]').forEach(el=>{
    const v=el.getAttribute('data-'+lang);if(v==null)return;
    if(v.includes('<b>'))el.innerHTML=v;else el.textContent=v;
  });
  document.getElementById('langToggle').innerHTML=lang==='tr'?'<b>TR</b> / EN':'TR / <b>EN</b>';
  renderRelated();
}

document.getElementById('langToggle').addEventListener('click',()=>{
  lang=lang==='tr'?'en':'tr';
  try{localStorage.setItem('scipeak_lang',lang)}catch{}
  render();
});

render();
</script>
